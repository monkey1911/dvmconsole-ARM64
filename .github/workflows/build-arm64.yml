name: Build (Windows ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-arm64:
    # Native Windows 11 ARM64 runner (free for public repositories)
    runs-on: windows-11-arm

    steps:
      - name: Checkout dvmconsole
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout dvmvocoder
        uses: actions/checkout@v4
        with:
          repository: DVMProject/dvmvocoder
          path: dvmvocoder

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build libvocoder (ARM64, MSVC)
        shell: pwsh
        run: |
          cmake -S dvmvocoder -B dvmvocoder/build -A ARM64
          cmake --build dvmvocoder/build --config Release
          New-Item -ItemType Directory -Force dvmconsole/Native/ARM64 | Out-Null
          Copy-Item (Get-ChildItem dvmvocoder/build -Recurse -Filter libvocoder.dll | Select-Object -First 1).FullName dvmconsole/Native/ARM64/

      - name: Build AmbeHost helper (x86, MSVC) and test stand-in
        shell: pwsh
        run: |
          cmake -S tools/AmbeHost -B build-ambehost -A Win32 -DAMBEHOST_BUILD_TEST_STUB=ON
          cmake --build build-ambehost --config Release

      - name: Test AmbeHost with the AMBE.DLL stand-in
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-ambehost | Out-Null
          Copy-Item build-ambehost/Release/AmbeHost.exe test-ambehost/
          Copy-Item build-ambehost/Release/AMBE.dll test-ambehost/
          dotnet run --project tools/AmbeHost/test/AmbeHostTest -c Release -- test-ambehost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish dvmconsole (win-arm64, self-contained)
        shell: pwsh
        run: |
          dotnet publish dvmconsole/DVMConsole.csproj -c Release -r win-arm64 --self-contained true -o out/dvmconsole-win-arm64
          Copy-Item build-ambehost/Release/AmbeHost.exe out/dvmconsole-win-arm64/

      - name: Verify ARM64 binaries
        shell: pwsh
        run: |
          function Get-Machine($path) {
            $b = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            '{0:X4}' -f [BitConverter]::ToUInt16($b, $pe + 4)
          }
          $expected = @{ 'DVMConsole.exe' = 'AA64'; 'libvocoder.dll' = 'AA64'; 'AmbeHost.exe' = '014C' }
          foreach ($f in $expected.Keys) {
            if (-not (Test-Path "out/dvmconsole-win-arm64/$f")) { Write-Error "$f missing from publish output"; exit 1 }
            $m = Get-Machine "out/dvmconsole-win-arm64/$f"
            Write-Host "$f machine = 0x$m"
            if ($m -ne $expected[$f]) { Write-Error "$f machine 0x$m, expected 0x$($expected[$f])"; exit 1 }
          }
          # AMBE.DLL is proprietary and must never be shipped (the CI stand-in included)
          if (Get-ChildItem out/dvmconsole-win-arm64 -Filter 'AMBE.dll') { Write-Error "AMBE.dll must not be in the package"; exit 1 }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dvmconsole-win-arm64
          path: out/dvmconsole-win-arm64
