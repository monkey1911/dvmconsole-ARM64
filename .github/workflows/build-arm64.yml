name: Build (Windows ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build-arm64:
    # Native Windows 11 ARM64 runner (free for public repositories)
    runs-on: windows-11-arm

    steps:
      - name: Checkout dvmconsole
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout dvmvocoder
        uses: actions/checkout@v4
        with:
          repository: DVMProject/dvmvocoder
          path: dvmvocoder

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build libvocoder (ARM64, MSVC)
        shell: pwsh
        run: |
          cmake -S dvmvocoder -B dvmvocoder/build -A ARM64
          cmake --build dvmvocoder/build --config Release
          New-Item -ItemType Directory -Force dvmconsole/Native/ARM64 | Out-Null
          Copy-Item (Get-ChildItem dvmvocoder/build -Recurse -Filter libvocoder.dll | Select-Object -First 1).FullName dvmconsole/Native/ARM64/

      - name: Publish dvmconsole (win-arm64, self-contained)
        shell: pwsh
        run: |
          dotnet publish dvmconsole/DVMConsole.csproj -c Release -r win-arm64 --self-contained true -o out/dvmconsole-win-arm64

      - name: Verify ARM64 binaries
        shell: pwsh
        run: |
          function Get-Machine($path) {
            $b = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            '{0:X4}' -f [BitConverter]::ToUInt16($b, $pe + 4)
          }
          foreach ($f in 'DVMConsole.exe', 'libvocoder.dll') {
            if (-not (Test-Path "out/dvmconsole-win-arm64/$f")) { Write-Error "$f missing from publish output"; exit 1 }
            $m = Get-Machine "out/dvmconsole-win-arm64/$f"
            Write-Host "$f machine = 0x$m"
            if ($m -ne 'AA64') { Write-Error "$f is not ARM64"; exit 1 }
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dvmconsole-win-arm64
          path: out/dvmconsole-win-arm64
